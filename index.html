    <script>
      // Dijalankan sebelum halaman digambar supaya pengguna mode gelap tidak melihat kilatan terang.
      try {
        var tema = localStorage.getItem('buku-besar:tema')
        if (tema !== 'light' && tema !== 'dark') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = tema
        var bahasa = localStorage.getItem('buku-besar:bahasa')
        if (bahasa === 'id' || bahasa === 'ja') document.documentElement.lang = bahasa
      } catch (e) {}
